<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE SHADOW LEDGER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050508;
      --surface: #0a0a10;
      --border: #1a1a2e;
      --accent: #c8a96e;
      --accent-dim: #7a6340;
      --text: #e8e0d0;
      --text-muted: #5a5468;
      --live: #39ff7a;
      --live-dim: #1a4a30;
      --red: #ff3a3a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    /* Noise grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.6;
    }

    /* Vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
      z-index: 99;
    }

    .wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
    }

    /* Subtle scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 98;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 4rem;
      opacity: 0;
      animation: fadeSlideDown 1s ease forwards 0.3s;
    }

    .eyebrow {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      color: var(--accent-dim);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .logo {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--accent);
      line-height: 1;
      text-shadow:
        0 0 60px rgba(200, 169, 110, 0.25),
        0 0 120px rgba(200, 169, 110, 0.1);
      position: relative;
    }

    .logo::after {
      content: 'THE SHADOW LEDGER';
      position: absolute;
      inset: 0;
      color: transparent;
      background: linear-gradient(135deg, var(--accent) 0%, #f5d48a 50%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .divider-main {
      width: 100%;
      max-width: 420px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
      margin: 1.5rem auto 0;
    }

    /* Live pulse indicator */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.2rem;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--live);
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 8px var(--live);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--live); }
      50% { opacity: 0.3; box-shadow: 0 0 2px var(--live); }
    }

    /* Main ledger card */
    .ledger {
      width: 100%;
      max-width: 520px;
      border: 1px solid var(--border);
      background: var(--surface);
      position: relative;
      opacity: 0;
      animation: fadeSlideUp 1s ease forwards 0.7s;
    }

    .ledger::before {
      content: '';
      position: absolute;
      top: -1px; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .ledger-header {
      padding: 1rem 1.8rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ledger-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.4em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .timestamp {
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .section-label {
      padding: 1.4rem 1.8rem 0.6rem;
      font-size: 0.55rem;
      letter-spacing: 0.5em;
      color: var(--accent-dim);
      text-transform: uppercase;
    }

    /* Deployment entries */
    .deployment-list {
      padding: 0 1.8rem 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .deployment {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 1.1rem 0;
      border-bottom: 1px solid rgba(26, 26, 46, 0.6);
      opacity: 0;
      position: relative;
    }

    .deployment:last-child { border-bottom: none; }

    .deployment:nth-child(1) { animation: fadeSlideRight 0.6s ease forwards 1.1s; }
    .deployment:nth-child(2) { animation: fadeSlideRight 0.6s ease forwards 1.35s; }
    .deployment:nth-child(3) { animation: fadeSlideRight 0.6s ease forwards 1.6s; }

    .deployment-left { display: flex; flex-direction: column; gap: 0.35rem; }

    .codename {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.12em;
      color: var(--text);
      line-height: 1;
    }

    .location-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .at-symbol {
      font-size: 0.6rem;
      color: var(--accent-dim);
      letter-spacing: 0.1em;
    }

    .location {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .status-chip {
      font-size: 0.52rem;
      letter-spacing: 0.25em;
      padding: 0.28rem 0.7rem;
      border: 1px solid var(--live-dim);
      color: var(--live);
      text-transform: uppercase;
      background: rgba(57, 255, 122, 0.04);
    }

    /* Horizontal rule between sections */
    .section-divider {
      margin: 0 1.8rem;
      height: 1px;
      background: var(--border);
    }

    /* Footer */
    .ledger-footer {
      padding: 0.9rem 1.8rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-note {
      font-size: 0.52rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .corner-mark {
      font-size: 0.52rem;
      color: rgba(200,169,110,0.2);
      letter-spacing: 0.15em;
    }

    /* Bottom tagline */
    .tagline {
      margin-top: 2.5rem;
      font-size: 0.55rem;
      letter-spacing: 0.4em;
      color: var(--text-muted);
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fadeIn 1s ease forwards 2s;
    }

    /* Decorative corner brackets on ledger */
    .bracket {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--accent-dim);
      border-style: solid;
    }
    .bracket.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .bracket.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .bracket.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .bracket.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    /* Animations */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideRight {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Clock update */
    #clock { font-variant-numeric: tabular-nums; }

    @media (max-width: 480px) {
      .codename { font-size: 1.35rem; }
      .location { font-size: 0.62rem; letter-spacing: 0.15em; }
      .logo { font-size: 2.4rem; }
    }

    .empty-state {
      padding: 1.5rem 0;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: var(--text-muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="wrapper">

    <header class="header">
      <p class="eyebrow">// Live Status Feed</p>
      <h1 class="logo">THE SHADOW LEDGER</h1>
      <div class="divider-main"></div>
      <div class="live-badge">
        <span class="pulse-dot"></span>
        <span>Updated Live</span>
      </div>
    </header>

    <main class="ledger">
      <div class="bracket tl"></div>
      <div class="bracket tr"></div>
      <div class="bracket bl"></div>
      <div class="bracket br"></div>

      <div class="ledger-header">
        <span class="ledger-title">Current Deployments</span>
        <span class="timestamp" id="clock">--:--:--</span>
      </div>

      <p class="section-label">// Active Operatives</p>

      <div class="deployment-list" id="deploymentList">
        <div class="empty-state">Syncing with network...</div>
      </div>

      <div class="ledger-footer">
        <span class="footer-note">Shadow Network · Encrypted</span>
        <span class="corner-mark">SL-001</span>
      </div>
    </main>

    <p class="tagline">// Clearance required beyond this point</p>

  </div>

  <script>
    // ── CONFIG — same credentials as your HQ site ──
    const SHEETS_KEY = "AIzaSyACMjXQCXjVo75hbMXtag_JctR4SoX70So";
    const SHEET_ID   = "1-MkZoNKkPqjAoJggahKiUsDUgjUhMTkoQ8rUBG4W-w0";
    const TAB_NAME   = "Sheet1"; // same tab as HQ

    // ── Live clock ──
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ── Fetch & render deployments ──
    async function fetchDeployments() {
      const list = document.getElementById('deploymentList');
      try {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(TAB_NAME)}?key=${SHEETS_KEY}`;
        const res  = await fetch(url);
        const data = await res.json();

        if (data.error) throw new Error(data.error.message);

        const rows = data.values || [];
        if (rows.length < 2) {
          list.innerHTML = '<div class="empty-state">No operatives on record.</div>';
          return;
        }

        // Columns: host_name | status | sign_in_time | paid | location
        const headers = rows[0].map(x => x.toLowerCase().trim());
        const ni = headers.indexOf('host_name');
        const si = headers.indexOf('status');
        const li = headers.indexOf('location');

        // Only show rows where status === 'ON' — same trigger as HQ
        const active = rows.slice(1).filter(r => (r[si] || '').toUpperCase().trim() === 'ON');

        if (!active.length) {
          list.innerHTML = `
            <div class="empty-state">
              <div style="font-size:1.4rem;margin-bottom:0.8rem;opacity:0.4;">◈</div>
              <div style="color:var(--accent);letter-spacing:0.3em;margin-bottom:0.6rem;">THE NIGHT IS QUIET</div>
              <div style="line-height:2;opacity:0.6;">The operatives are in the shadows.<br>Shift begins soon — check the site<br>for the next show.</div>
            </div>`;
          return;
        }

        list.innerHTML = active.map((r, i) => `
          <div class="deployment" style="animation:fadeSlideRight 0.6s ease forwards ${0.1 + i * 0.2}s; opacity:0;">
            <div class="deployment-left">
              <span class="codename">${(r[ni] || '—').toUpperCase()}</span>
              <div class="location-wrap">
                <span class="at-symbol">AT ///</span>
                <span class="location">${r[li] || '—'}</span>
              </div>
            </div>
            <span class="status-chip">On Site</span>
          </div>
        `).join('');

      } catch(e) {
        list.innerHTML = `<div class="empty-state" style="color:#ff6b6b;">Signal lost — ${e.message}</div>`;
      }
    }

    // Fetch on load, then refresh every 60 seconds
    fetchDeployments();
    setInterval(fetchDeployments, 60000);
  </script>
</body>
</html>
