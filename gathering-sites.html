<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE GATHERING SITES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08050e;
      --surface: #100d18;
      --border: rgba(180, 130, 200, 0.15);
      --border-bright: rgba(180, 130, 200, 0.35);
      --accent: #c9a96e;
      --accent-dim: #7a6340;
      --rose: #c47a95;
      --rose-dim: rgba(196, 122, 149, 0.15);
      --text: #ede8f5;
      --text-muted: #6a5a7a;
      --live: #3aaa6a;
      --live-dim: rgba(58, 170, 106, 0.12);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* Soft gradient atmosphere */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(180, 100, 160, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(100, 60, 160, 0.07) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(4, 2, 10, 0.9) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1.5rem 2rem;
      position: relative;
      z-index: 2;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeSlideDown 1.1s ease forwards 0.3s;
    }

    .eyebrow {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 200;
      font-size: 0.65rem;
      letter-spacing: 0.45em;
      color: var(--rose);
      text-transform: uppercase;
      margin-bottom: 1.1rem;
      opacity: 0.7;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.6rem, 8vw, 5rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      color: var(--accent);
      line-height: 1;
      font-style: italic;
      text-shadow:
        0 0 80px rgba(200, 169, 110, 0.2),
        0 0 160px rgba(180, 100, 160, 0.1);
    }

    .logo-sub {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 200;
      font-size: 0.6rem;
      letter-spacing: 0.55em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 0.7rem;
    }

    .divider-main {
      width: 100%;
      max-width: 380px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200,169,110,0.4), rgba(196,122,149,0.3), transparent);
      margin: 1.4rem auto 0;
    }

    /* Live pulse indicator */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.2rem;
      font-size: 0.58rem;
      letter-spacing: 0.35em;
      color: var(--live);
      text-transform: uppercase;
      font-weight: 300;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 8px var(--live);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--live); }
      50% { opacity: 0.3; box-shadow: 0 0 2px var(--live); }
    }

    /* Main card */
    .ledger {
      width: 100%;
      max-width: 500px;
      border: 1px solid var(--border);
      background: var(--surface);
      position: relative;
      opacity: 0;
      animation: fadeSlideUp 1.1s ease forwards 0.7s;
    }

    .ledger::before {
      content: '';
      position: absolute;
      top: -1px; left: 15%; right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--rose), transparent);
    }

    .ledger-header {
      padding: 1.1rem 1.8rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ledger-title {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 200;
      font-size: 0.58rem;
      letter-spacing: 0.45em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .timestamp {
      font-size: 0.56rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 200;
    }

    .section-label {
      padding: 1.4rem 1.8rem 0.5rem;
      font-size: 0.52rem;
      letter-spacing: 0.5em;
      color: var(--accent-dim);
      text-transform: uppercase;
      font-weight: 300;
    }

    /* Venue entries */
    .deployment-list {
      padding: 0 1.8rem 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .deployment {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 1.1rem 0;
      border-bottom: 1px solid rgba(180, 130, 200, 0.08);
      opacity: 0;
      position: relative;
    }

    .deployment:last-child { border-bottom: none; }

    .deployment:nth-child(1) { animation: fadeSlideRight 0.7s ease forwards 1.1s; }
    .deployment:nth-child(2) { animation: fadeSlideRight 0.7s ease forwards 1.35s; }
    .deployment:nth-child(3) { animation: fadeSlideRight 0.7s ease forwards 1.6s; }

    .deployment-left { display: flex; flex-direction: column; gap: 0.4rem; }

    .codename {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.7rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--text);
      line-height: 1;
    }

    .location-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .at-symbol {
      font-size: 0.55rem;
      color: var(--rose);
      letter-spacing: 0.1em;
      opacity: 0.6;
      font-style: italic;
      font-family: 'Cormorant Garamond', serif;
    }

    .location {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 300;
    }

    .status-chip {
      font-size: 0.5rem;
      letter-spacing: 0.22em;
      padding: 0.28rem 0.75rem;
      border: 1px solid rgba(58, 170, 106, 0.3);
      color: var(--live);
      text-transform: uppercase;
      background: var(--live-dim);
      font-weight: 300;
    }

    /* Footer */
    .ledger-footer {
      padding: 0.9rem 1.8rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-note {
      font-size: 0.5rem;
      letter-spacing: 0.22em;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 200;
    }

    .corner-mark {
      font-size: 0.5rem;
      color: rgba(200,169,110,0.15);
      letter-spacing: 0.15em;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
    }

    /* Bottom tagline */
    .tagline {
      margin-top: 2.5rem;
      font-size: 0.53rem;
      letter-spacing: 0.38em;
      color: var(--text-muted);
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      font-weight: 200;
      animation: fadeIn 1s ease forwards 2.1s;
    }

    /* Decorative corner accents */
    .bracket {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--accent-dim);
      border-style: solid;
      opacity: 0.5;
    }
    .bracket.tl { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .bracket.tr { top: -1px; right: -1px; border-width: 1px 1px 0 0; }
    .bracket.bl { bottom: -1px; left: -1px; border-width: 0 0 1px 1px; }
    .bracket.br { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

    /* Animations */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideRight {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #clock { font-variant-numeric: tabular-nums; }

    .empty-state {
      padding: 2rem 0;
      text-align: center;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      color: var(--text-muted);
      text-transform: uppercase;
      line-height: 1;
    }

    @media (max-width: 480px) {
      .codename { font-size: 1.45rem; }
      .location { font-size: 0.6rem; letter-spacing: 0.14em; }
      .logo { font-size: 2.6rem; }
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <header class="header">
      <p class="eyebrow">Tonight's Hosts Are Here</p>
      <h1 class="logo">The Gathering Sites</h1>
      <p class="logo-sub">Belladonna Nights</p>
      <div class="divider-main"></div>
      <div class="live-badge">
        <span class="pulse-dot"></span>
        <span>Updated Live</span>
      </div>
    </header>

    <main class="ledger">
      <div class="bracket tl"></div>
      <div class="bracket tr"></div>
      <div class="bracket bl"></div>
      <div class="bracket br"></div>

      <div class="ledger-header">
        <span class="ledger-title">Where the Night Is Happening</span>
        <span class="timestamp" id="clock">--:--:--</span>
      </div>

      <p class="section-label">On Stage Tonight</p>

      <div class="deployment-list" id="deploymentList">
        <div class="empty-state">Finding the night...</div>
      </div>

      <div class="ledger-footer">
        <span class="footer-note">Belladonna Nights · Live</span>
        <span class="corner-mark">always on</span>
      </div>
    </main>

    <p class="tagline">Come find us · The night is waiting</p>

  </div>

  <script>
    // ── CONFIG ──
    const SHEETS_KEY = "AIzaSyACMjXQCXjVo75hbMXtag_JctR4SoX70So";
    const SHEET_ID   = "1-MkZoNKkPqjAoJggahKiUsDUgjUhMTkoQ8rUBG4W-w0";
    const TAB_NAME   = "Sheet1";

    // ── Live clock ──
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ── Fetch & render ──
    async function fetchDeployments() {
      const list = document.getElementById('deploymentList');
      try {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(TAB_NAME)}?key=${SHEETS_KEY}`;
        const res  = await fetch(url);
        const data = await res.json();

        if (data.error) throw new Error(data.error.message);

        const rows = data.values || [];
        if (rows.length < 2) {
          list.innerHTML = `
            <div class="empty-state">
              <div style="font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-style:italic;color:var(--accent);opacity:0.5;margin-bottom:0.9rem;">✦</div>
              <div style="color:var(--accent);letter-spacing:0.3em;margin-bottom:0.8rem;font-size:0.62rem;">The Night Is Quiet</div>
              <div style="line-height:2.2;opacity:0.55;font-size:0.58rem;">The hosts are getting ready.<br>Check back soon — or visit the site<br>to see when the next show starts.</div>
            </div>`;
          return;
        }

        const headers = rows[0].map(x => x.toLowerCase().trim());
        const ni = headers.indexOf('host_name');
        const si = headers.indexOf('status');
        const li = headers.indexOf('location');

        const active = rows.slice(1).filter(r => (r[si] || '').toUpperCase().trim() === 'ON');

        if (!active.length) {
          list.innerHTML = `
            <div class="empty-state">
              <div style="font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-style:italic;color:var(--accent);opacity:0.5;margin-bottom:0.9rem;">✦</div>
              <div style="color:var(--accent);letter-spacing:0.3em;margin-bottom:0.8rem;font-size:0.62rem;">The Night Is Quiet</div>
              <div style="line-height:2.2;opacity:0.55;font-size:0.58rem;">The hosts are getting ready.<br>Check back soon — or visit the site<br>to see when the next show starts.</div>
            </div>`;
          return;
        }

        list.innerHTML = active.map((r, i) => `
          <div class="deployment" style="animation:fadeSlideRight 0.7s ease forwards ${0.1 + i * 0.2}s; opacity:0;">
            <div class="deployment-left">
              <span class="codename">${(r[ni] || '—')}</span>
              <div class="location-wrap">
                <span class="at-symbol">at</span>
                <span class="location">${r[li] || '—'}</span>
              </div>
            </div>
            <span class="status-chip">Live Now</span>
          </div>
        `).join('');

      } catch(e) {
        list.innerHTML = `<div class="empty-state" style="color:var(--rose);opacity:0.7;">Couldn't reach the network — ${e.message}</div>`;
      }
    }

    fetchDeployments();
    setInterval(fetchDeployments, 60000);
  </script>
</body>
</html>
